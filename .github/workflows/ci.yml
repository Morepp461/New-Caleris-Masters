name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "chore/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Monte Carlo calibration
        run: npm run race:calibrate -- --runs=1000

      - name: Race engine throughput benchmark
        run: npm run race:benchmark

      - name: Upload Phase 10 balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-balance-report
          path: artifacts/phase-10-*-report.json
          if-no-files-found: ignore

      - name: Production build
        run: npm run build
        env:
          MONGODB_DB: caleris_masters_dev

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
